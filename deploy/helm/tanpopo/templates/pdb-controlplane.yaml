{{- if .Values.controlPlane.pdb.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tanpopo.fullname" . }}-controlplane
  labels:
    {{- include "tanpopo.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  minAvailable: {{ .Values.controlPlane.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tanpopo.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
{{- end -}}
