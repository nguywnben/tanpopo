  /a2a/tasks:
    post:
      tags: [A2APlane]
      operationId: createA2aTask
      summary: Delegate stateful A2A Task with sub-budget hold and hop_count <= 5 enforcement (v0.3, SM-09)
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/DataRegionHeader"
        - $ref: "#/components/parameters/TraceRootHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/A2aTaskCreateRequest"
      responses:
        "201":
          description: Task accepted in submitted state under attenuated delegation envelope (SM-09)
          headers:
            x-tanpopo-request-id: { $ref: "#/components/headers/X-Tanpopo-Request-Id" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aTask"
        "400":
          description: 400 delegation_depth_exceeded (cycle or hop_count > 5)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }
        "403":
          description: residency_incompatible or budget_or_privilege_exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }

  /a2a/tasks/{taskId}:
    get:
      tags: [A2APlane]
      operationId: getA2aTask
      summary: Inspect A2A Task state (SM-09) or subscribe to SSE task updates (v0.3)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/TraceRootHeader"
