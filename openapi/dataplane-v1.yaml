            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }

  /a2a/tasks/{taskId}/cancel:
    post:
      tags: [A2APlane]
      operationId: cancelA2aTask
      summary: Cancel an in-flight A2A Task and release remaining attenuated sub-budget hold (v0.3, SM-09)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task transitioned to canceled state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aTask"
