  /native/{dialect}/{upstreamPath}:
    post:
      tags: [NativePassthrough]
      operationId: proxyNativeDialect
      security:
        - VirtualKeyBearer: []
        - NativeApiKeyHeader: []
        - NativeGoogleKeyHeader: []
        - TanpopoVirtualKeyHeader: []
      summary: Lossless Native Dialect Passthrough (Anthropic, Gemini, Custom Adapter Prefix; 400 dialect_mismatch on cross-dialect target)
      parameters:
        - name: dialect
          in: path
          required: true
          schema:
            type: string
            examples: [anthropic, gemini]
        - name: upstreamPath
          in: path
          required: true
          schema:
            type: string
            examples: [v1/messages, "v1beta/models/gemini-2.5-pro:streamGenerateContent"]
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/TimeoutMsHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/DataRegionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Untouched vendor-native JSON or SSE stream
          headers:
            x-tanpopo-request-id: { $ref: "#/components/headers/X-Tanpopo-Request-Id" }
            X-Tanpopo-Usage-Accuracy: { $ref: "#/components/headers/X-Tanpopo-Usage-Accuracy" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        "400":
          description: 400 dialect_mismatch when target deployment wire dialect differs from path {dialect}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }
        "429":
          description: project_budget_exceeded or rate_limit_exceeded
          headers:
            Retry-After: { $ref: "#/components/headers/Retry-After" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }
        "503":
          description: no_compliant_deployment_available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }

  /mcp:
    post:
      tags: [MCPHub]
      operationId: postMcpStreamableHttp
      summary: >-
        Dedicated MCP Governance Hub (MCP Specification 2025-03-26 Streamable HTTP — v0.2).
        Async HITL destructive approvals return HTTP 200 JSON-RPC (isError=true) bound to
        5-tuple JCS hash SHA-256(JCS({org_id, virtual_key_id, server_slug, tool_name, arguments}));
        IDE/client compatibility is empirically verified via CT-36 rather than assumed upfront (COND-PO-04).
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/McpSessionIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/TraceRootHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpJsonRpcRequest"
      responses:
        "200":
          description: Standard MCP 2025-03-26 JSON-RPC response (including async HITL pending envelope) or SSE upgrade
          headers:
            x-tanpopo-request-id: { $ref: "#/components/headers/X-Tanpopo-Request-Id" }
            Mcp-Session-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpJsonRpcResponse"
            text/event-stream:
              schema:
                type: string
        "202":
          description: Empty acknowledgement strictly for JSON-RPC notifications/responses per MCP 2025-03-26 (never used for tool-call HITL approval!)
        "403":
          description: scope_or_plane_denied, schema_hash_drift_blocked, or parameter_hash_mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }
        "504":
          description: ambiguous_side_effect_timeout on mutating/destructive tool timeout (0 automatic retries)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }
    get:
      tags: [MCPHub]
      operationId: openMcpServerStream
      summary: Open optional MCP 2025-03-26 server-to-client SSE notification stream
      parameters:
        - $ref: "#/components/parameters/McpSessionIdHeader"
      responses:
        "200":
          description: Server-initiated MCP SSE stream
          content:
            text/event-stream:
              schema:
                type: string
    delete:
      tags: [MCPHub]
      operationId: closeMcpSession
      summary: Terminate an active MCP 2025-03-26 Streamable HTTP session
      parameters:
        - $ref: "#/components/parameters/McpSessionIdHeader"
      responses:
        "204":
          description: Session terminated cleanly

