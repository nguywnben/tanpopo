# Canonical Data Plane OpenAPI 3.1 Contract (SPEC-API-01 / SPEC-EXT-05 / SPEC-EXT-06 / CR-01, CR-05, CR-08, CR-09).
openapi: 3.1.0
info:
  title: Tanpopo AI Gateway — Multi-Plane Data Plane & Operational Probes API
  version: 0.1.0
  description: >-
    Machine-readable OpenAPI 3.1.0 contract covering Unified Inference (/v1/*),
    Lossless Native Passthrough (/native/{dialect}/{upstreamPath}), Dedicated MCP
    Governance Hub (/mcp — MCP Specification 2025-03-26 Streamable HTTP),
    Dedicated A2A Inter-Agent Plane (/a2a/* — SM-09), and Operational Probes
    (/healthz, /readyz, /metrics). All quantitative latency/throughput figures in
    descriptions are TARGET / UNVERIFIED until M0/M5 empirical benchmarks complete.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://127.0.0.1:8080
    description: Local standalone Data Plane listener (Mode A default)
  - url: http://127.0.0.1:9090
    description: Dedicated internal Metrics / Control Plane listener (Mode B/C)

security:
  - VirtualKeyBearer: []

tags:
  - name: Probes
    description: Kubernetes / systemd liveness, readiness, and bounded Prometheus scrape endpoints.
  - name: UnifiedInference
    description: OpenAI-compatible Unified Provider Ingress (/v1/*).
  - name: NativePassthrough
    description: Lossless vendor-native wire dialect passthrough (/native/*).
  - name: MCPHub
    description: Dedicated Model Context Protocol 2025-03-26 Streamable HTTP Governance Hub (/mcp — v0.2).
  - name: A2APlane
    description: Dedicated Agent2Agent task delegation plane (/a2a/* — v0.3, SM-09).

components:
  securitySchemes:
    VirtualKeyBearer:
      type: http
      scheme: bearer
      description: >-
        Environment-bound Tanpopo Virtual Key (vk_tp_<env>_<32_base62>) or
        ephemeral Playground key. Strictly prohibited on /admin/v1/* (AUTH-07).
    NativeApiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: >-
        Native Anthropic SDK Virtual Key carrier; stripped at ingress before
        Host Blind Broker injects the upstream credential.
    NativeGoogleKeyHeader:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: >-
        Native Google GenAI SDK Virtual Key carrier; stripped at ingress before
        Host Blind Broker injects the upstream credential.
    TanpopoVirtualKeyHeader:
      type: apiKey
      in: header
      name: X-Tanpopo-Virtual-Key
      description: Explicit Tanpopo Virtual Key header accepted on /native/* routes.
    MetricsScraperBearer:
      type: http
      scheme: bearer
      description: Optional internal scrape token on :9090/metrics.

  parameters:
    RequestIdHeader:
      name: x-tanpopo-request-id
      in: header
      required: false
      description: Optional caller correlation ID (minted as req_<crockford32> if omitted or malformed).
      schema:
        type: string
        maxLength: 64
    TimeoutMsHeader:
      name: X-Tanpopo-Timeout-Ms
      in: header
      required: false
      description: Per-request deadline ceiling in milliseconds (clamped by Route/Deployment max, <= 300000 ms).
      schema:
        type: integer
        minimum: 100
        maximum: 300000
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Client-generated idempotency token (<= 128 ASCII chars, 24h TTL) bound
        atomically to (org_id, virtual_key_id, idempotency_key, sha256(payload)).
      schema:
        type: string
        minLength: 1
        maxLength: 128
    DataRegionHeader:
      name: X-Tanpopo-Data-Region
      in: header
      required: false
      description: Narrowing per-request Data Residency constraint (fail-closed intersection with Policy).
      schema:
        type: string
        enum: [EU, US, APAC, ON_PREM]
    TraceRootHeader:
      name: X-Tanpopo-Trace-Root
      in: header
      required: false
      description: Cross-plane root correlation ID propagated across A2A, Provider, and MCP hops.
      schema:
        type: string
        maxLength: 64
    NoCacheHeader:
      name: X-Tanpopo-No-Cache
      in: header
      required: false
      description: Bypasses opt-in exact/semantic response cache (v0.3+).
      schema:
        type: boolean
    McpSessionIdHeader:
      name: Mcp-Session-Id
      in: header
      required: false
      description: Standard MCP 2025-03-26 Streamable HTTP session identifier.
      schema:
        type: string
        maxLength: 128

  headers:
    X-Tanpopo-Request-Id:
      description: System-wide unique request correlation ID (req_<26_crockford_base32>).
      schema:
        type: string
    X-Tanpopo-Usage-Accuracy:
      description: Settlement fidelity tier recorded in the two-phase micro-USD ledger.
      schema:
        type: string
        enum: [EXACT, ESTIMATED, UNMETERED_FLAGGED]
    Retry-After:
      description: Backoff window in delta-seconds before retrying a 429 or 503 response.
      schema:
        type: integer
        minimum: 1
    X-RateLimit-Remaining-Requests:
      description: Remaining RPM bucket tokens in the active window for the caller scope.
      schema:
        type: integer
        minimum: 0
    X-RateLimit-Remaining-Tokens:
      description: Remaining TPM bucket tokens in the active window for the caller scope.
      schema:
        type: integer
        minimum: 0
    X-RateLimit-Remaining-Streams:
      description: Remaining concurrent open SSE stream slots permitted for the Virtual Key.
      schema:
        type: integer
        minimum: 0

  schemas:
    CanonicalError:
      type: object
      additionalProperties: false
      required: [code, type, message, request_id, retryable]
      properties:
        code:
          type: string
          examples:
            - capability_not_supported
            - dialect_mismatch
            - delegation_depth_exceeded
            - invalid_virtual_key
            - invalid_credential_plane
            - scope_or_plane_denied
            - parameter_hash_mismatch
            - schema_hash_drift_blocked
            - project_budget_exceeded
            - rate_limit_exceeded
            - extension_execution_fault
            - no_compliant_deployment_available
            - extension_quarantined
            - ambiguous_side_effect_timeout
            - mid_stream_abort
        type:
          type: string
          enum:
            - invalid_request_error
            - authentication_error
            - permission_error
            - not_found_error
            - conflict_error
            - rate_limit_error
            - upstream_error
            - extension_error
            - residency_unavailable_error
            - side_effect_timeout_error
        message:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean

    CanonicalErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/CanonicalError"

    CapabilityProfile:
      type: object
      additionalProperties: false
      required:
        - streaming
        - tool_calling
        - parallel_tool_calls
        - strict_json_schema
        - json_object
        - vision
        - audio_input
        - document_input
        - reasoning
        - prompt_caching
        - embeddings
        - rerank
      properties:
        streaming: { type: boolean }
        tool_calling: { type: boolean }
        parallel_tool_calls: { type: boolean }
        strict_json_schema: { type: boolean }
        json_object: { type: boolean }
        vision: { type: boolean }
        audio_input: { type: boolean }
        document_input: { type: boolean }
        reasoning: { type: boolean }
        prompt_caching: { type: boolean }
        embeddings: { type: boolean }
        rerank: { type: boolean }

    ToolDefinition:
      type: object
      required: [type, function]
      properties:
        type:
          type: string
          enum: [function]
        function:
          type: object
          required: [name]
          properties:
            name: { type: string }
            description: { type: string }
            strict: { type: boolean }
            parameters: { type: object }

    ToolChoice:
      oneOf:
        - type: string
          enum: [none, auto, required]
        - type: object
          required: [type, function]
          properties:
            type:
              type: string
              const: function
            function:
              type: object
              required: [name]
              properties:
                name: { type: string }

    ResponseFormat:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, json_object, json_schema]
        json_schema:
          type: object
          required: [name, schema]
          properties:
            name: { type: string }
            description: { type: string }
            strict: { type: boolean }
            schema: { type: object }

    UsageSummary:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        cache_read_tokens: { type: integer, minimum: 0 }
        cache_write_tokens: { type: integer, minimum: 0 }
        reasoning_tokens: { type: integer, minimum: 0 }

    ChatMessage:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, developer, user, assistant, tool]
        content:
          oneOf:
            - type: ["string", "null"]
            - type: array
              items:
                type: object
                required: [type]
                properties:
                  type:
                    type: string
                    enum: [text, image_url, input_audio, file]
                  text: { type: string }
                  image_url:
                    type: object
                    required: [url]
                    properties:
                      url: { type: string }
                      detail: { type: string, enum: [auto, low, high] }
                  input_audio:
                    type: object
                    required: [data, format]
                    properties:
                      data: { type: string }
                      format: { type: string, enum: [wav, mp3] }
                  file:
                    type: object
                    properties:
                      filename: { type: string }
                      file_data: { type: string }
        tool_call_id: { type: string }
        tool_calls:
          type: array
          items:
            type: object
            required: [id, type, function]
            properties:
              id: { type: string }
              type: { type: string, const: function }
              function:
                type: object
                required: [name, arguments]
                properties:
                  name: { type: string }
                  arguments: { type: string }

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          minLength: 1
          description: Route slug or Logical Model slug within the Virtual Key's Environment.
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream:
          type: boolean
          default: false
        stream_options:
          type: object
          description: >-
            When stream=true, Tanpopo automatically injects include_usage=true
            upstream on OpenAI-compatible adapters (CR-09) to maximize EXACT settlement.
          properties:
            include_usage: { type: boolean }
        max_completion_tokens:
          type: integer
          minimum: 1
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          minimum: 0
          maximum: 1
        stop:
          oneOf:
            - type: string
            - type: array
              maxItems: 4
              items: { type: string }
        reasoning_effort:
          type: string
          enum: [low, medium, high]
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolDefinition"
        tool_choice:
          $ref: "#/components/schemas/ToolChoice"
        parallel_tool_calls:
          type: boolean
        response_format:
          $ref: "#/components/schemas/ResponseFormat"

    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id: { type: string }
        object: { type: string, enum: [chat.completion] }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index: { type: integer }
              message:
                $ref: "#/components/schemas/ChatMessage"
              finish_reason:
                type: ["string", "null"]
        usage:
          $ref: "#/components/schemas/UsageSummary"

    ResponsesApiRequest:
      type: object
      required: [model, input]
      properties:
        model: { type: string, minLength: 1 }
        input:
          oneOf:
            - type: string
            - type: array
              items: { type: object }
        instructions: { type: string }
        stream: { type: boolean, default: false }
        max_output_tokens: { type: integer, minimum: 1 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        top_p: { type: number, minimum: 0, maximum: 1 }
        reasoning:
          type: object
          properties:
            effort: { type: string, enum: [low, medium, high] }
        tools:
          type: array
          items: { type: object }
        tool_choice:
          $ref: "#/components/schemas/ToolChoice"
        parallel_tool_calls: { type: boolean }
        text:
          type: object
          properties:
            format:
              $ref: "#/components/schemas/ResponseFormat"

    ResponsesApiResponse:
      type: object
      required: [id, object, created_at, model, output, status]
      properties:
        id: { type: string }
        object: { type: string, const: response }
        created_at: { type: integer }
        model: { type: string }
        status: { type: string, enum: [completed, incomplete, failed] }
        output:
          type: array
          items: { type: object }
        usage:
          $ref: "#/components/schemas/UsageSummary"

    EmbeddingRequest:
      type: object
      required: [model, input]
      properties:
        model: { type: string, minLength: 1 }
        input:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              items: { type: string }
        encoding_format:
          type: string
          enum: [float, base64]
          default: float
        dimensions:
          type: integer
          minimum: 1

    EmbeddingResponse:
      type: object
      required: [object, model, data, usage]
      properties:
        object: { type: string, const: list }
        model: { type: string }
        data:
          type: array
          items:
            type: object
            required: [object, index, embedding]
            properties:
              object: { type: string, const: embedding }
              index: { type: integer }
              embedding:
                oneOf:
                  - type: array
                    items: { type: number }
                  - type: string
        usage:
          type: object
          required: [prompt_tokens, total_tokens]
          properties:
            prompt_tokens: { type: integer }
            total_tokens: { type: integer }

    ModelCard:
      type: object
      required: [id, object, created, owned_by, capabilities]
      properties:
        id: { type: string }
        object: { type: string, const: model }
        created: { type: integer }
        owned_by: { type: string }
        context_window: { type: integer }
        max_output_tokens: { type: integer }
        assurance_tier:
          type: string
          enum: [DECLARED, TESTED, VERIFIED]
        capabilities:
          $ref: "#/components/schemas/CapabilityProfile"

    ModelListResponse:
      type: object
      required: [object, data]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items:
            $ref: "#/components/schemas/ModelCard"

    RerankRequest:
      type: object
      required: [model, query, documents]
      properties:
        model: { type: string, minLength: 1 }
        query: { type: string, minLength: 1 }
        documents:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: string
              - type: object
                required: [text]
                properties:
                  id: { type: string }
                  text: { type: string }
        top_n:
          type: integer
          minimum: 1
        return_documents:
          type: boolean
          default: false

    RerankResponse:
      type: object
      required: [id, model, results]
      properties:
        id: { type: string }
        model: { type: string }
        results:
          type: array
          items:
            type: object
            required: [index, relevance_score]
            properties:
              index: { type: integer }
              relevance_score: { type: number }
              document:
                type: object
                properties:
                  text: { type: string }
        usage:
          type: object
          properties:
            search_units: { type: integer, minimum: 0 }
            total_tokens: { type: integer, minimum: 0 }

    McpJsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
          examples: [initialize, notifications/initialized, tools/list, tools/call, resources/list, prompts/list]
        params:
          type: object
          properties:
            name: { type: string, description: "Namespaced tool <server_slug>__<tool_name> or tanpopo__check_approval_and_resume" }
            arguments: { type: object }
            cursor: { type: string }
            _meta:
              type: object
              properties:
                tanpopoApprovalToken:
                  type: string
                  description: Single-use nonce bound to SHA-256(JCS({org_id, virtual_key_id, server_slug, tool_name, arguments})).

    McpAsyncApprovalPendingContent:
      type: object
      required: [status, approval_request_id, approval_binding_hash, expires_at, resume_tool]
      properties:
        status: { type: string, const: APPROVAL_PENDING }
        approval_request_id: { type: string }
        approval_binding_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: SHA-256(JCS({org_id, virtual_key_id, server_slug, tool_name, arguments}))
        expires_at: { type: string, format: date-time }
        resume_tool: { type: string, const: tanpopo__check_approval_and_resume }

    McpJsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        result:
          type: object
          description: >-
            Standard MCP 2025-03-26 result object. For paused destructive tools
            in async HITL mode (CR-08), returns HTTP 200 with isError=true and
            structured content referencing approval_request_id and
            tanpopo__check_approval_and_resume.
          properties:
            isError: { type: boolean }
            content:
              type: array
              items: { type: object }
            structuredContent:
              $ref: "#/components/schemas/McpAsyncApprovalPendingContent"
            nextCursor: { type: string }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer }
            message: { type: string }
            data: { type: object }

    A2aAgentCard:
      type: object
      required: [agent_id, name, endpoint_url, data_region, max_delegation_hops, skills]
      properties:
        agent_id: { type: string }
        name: { type: string }
        description: { type: string }
        endpoint_url: { type: string, format: uri }
        data_region: { type: string, enum: [EU, US, APAC, ON_PREM] }
        max_delegation_hops: { type: integer, minimum: 1, maximum: 5 }
        skills:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }

    A2aAgentCardListResponse:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/A2aAgentCard"
        next_cursor:
          type: ["string", "null"]
        has_more:
          type: boolean

    A2aTaskCreateRequest:
      type: object
      required: [target_agent_id, input_parts]
      properties:
        target_agent_id: { type: string }
        sub_budget_hold_micros:
          type: integer
          minimum: 0
          description: Carved directly from caller's remaining project budget balance (TP-FR-0406).
        lineage_agent_ids:
          type: array
          maxItems: 5
          items: { type: string }
        hop_count:
          type: integer
          minimum: 1
          maximum: 5
        input_parts:
          type: array
          minItems: 1
          items: { type: object }

    A2aTask:
      type: object
      required: [task_id, target_agent_id, state, hop_count, created_at]
      properties:
        task_id: { type: string }
        target_agent_id: { type: string }
        state:
          type: string
          description: Dedicated SM-09 A2A Task Lifecycle states (CR-08).
          enum: [submitted, working, input-required, completed, failed, canceled]
        hop_count: { type: integer, minimum: 1, maximum: 5 }
        sub_budget_hold_micros: { type: integer, minimum: 0 }
        artifacts:
          type: array
          items: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProbeStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, not_ready, draining, stale_security_state]
        config_epoch:
          type: integer
        snapshot_age_ms:
          type: integer

paths:
  /healthz:
    get:
      tags: [Probes]
      operationId: getLivenessProbe
      security: []
      summary: Process liveness probe (never queries DB, Valkey, or upstream AI vendors)
      responses:
        "200":
          description: HTTP event loop alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeStatusResponse"
        "503":
          description: Internal event loop unresponsive

  /readyz:
    get:
      tags: [Probes]
      operationId: getReadinessProbe
      security: []
      summary: Readiness probe (ConfigSnapshot loaded, revocation lag <= 10s, Wasm warm pool ready, not draining)
      responses:
        "200":
          description: Ready to accept new traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeStatusResponse"
        "503":
          description: Cold-booting, draining active SSE streams on SIGTERM, or stale revocation lag > 10s
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeStatusResponse"

  /metrics:
    get:
      tags: [Probes]
      operationId: scrapePrometheusMetrics
      security:
        - {}
        - MetricsScraperBearer: []
      summary: >-
        Prometheus exposition metrics on internal listener (:9090) with bounded
        labels {org_id, project_id, adapter_id, logical_model, status_class,
        error_code, accuracy_tier} and optional high-tenant org_id/project_id
        toggle (0 request_id/virtual_key_id/principal_id labels).
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid internal scrape token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalErrorEnvelope"

  /v1/chat/completions:
    post:
      tags: [UnifiedInference]
      operationId: createChatCompletion
      summary: Unified Chat & Multimodal Inference (Sync JSON or SSE text/event-stream; > 64 KiB media routed via blob_ref)
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/TimeoutMsHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/DataRegionHeader"
        - $ref: "#/components/parameters/TraceRootHeader"
        - $ref: "#/components/parameters/NoCacheHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Unified completion JSON or SSE chunk stream (terminal mid_stream_abort event on post-chunk-1 drop)
          headers:
            x-tanpopo-request-id: { $ref: "#/components/headers/X-Tanpopo-Request-Id" }
            X-Tanpopo-Usage-Accuracy: { $ref: "#/components/headers/X-Tanpopo-Usage-Accuracy" }
            X-RateLimit-Remaining-Requests: { $ref: "#/components/headers/X-RateLimit-Remaining-Requests" }
            X-RateLimit-Remaining-Tokens: { $ref: "#/components/headers/X-RateLimit-Remaining-Tokens" }
            X-RateLimit-Remaining-Streams: { $ref: "#/components/headers/X-RateLimit-Remaining-Streams" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid payload or capability_not_supported
          headers:
            x-tanpopo-request-id: { $ref: "#/components/headers/X-Tanpopo-Request-Id" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalErrorEnvelope"
        "401":
          description: invalid_virtual_key or invalid_credential_plane
          headers:
            x-tanpopo-request-id: { $ref: "#/components/headers/X-Tanpopo-Request-Id" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalErrorEnvelope"
        "403":
          description: scope_or_plane_denied or model_denied_by_policy
          headers:
            x-tanpopo-request-id: { $ref: "#/components/headers/X-Tanpopo-Request-Id" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalErrorEnvelope"
        "409":
          description: Duplicate Idempotency-Key currently request_in_progress
          headers:
            x-tanpopo-request-id: { $ref: "#/components/headers/X-Tanpopo-Request-Id" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalErrorEnvelope"
        "422":
          description: idempotency_key_reused_mismatch
          headers:
            x-tanpopo-request-id: { $ref: "#/components/headers/X-Tanpopo-Request-Id" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalErrorEnvelope"
        "429":
          description: project_budget_exceeded or rate_limit_exceeded
          headers:
            x-tanpopo-request-id: { $ref: "#/components/headers/X-Tanpopo-Request-Id" }
            Retry-After: { $ref: "#/components/headers/Retry-After" }
            X-RateLimit-Remaining-Requests: { $ref: "#/components/headers/X-RateLimit-Remaining-Requests" }
            X-RateLimit-Remaining-Tokens: { $ref: "#/components/headers/X-RateLimit-Remaining-Tokens" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalErrorEnvelope"
        "502":
          description: extension_execution_fault or upstream_malformed_response
          headers:
            x-tanpopo-request-id: { $ref: "#/components/headers/X-Tanpopo-Request-Id" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalErrorEnvelope"
        "503":
          description: no_compliant_deployment_available, extension_quarantined, or gateway_overloaded
          headers:
            x-tanpopo-request-id: { $ref: "#/components/headers/X-Tanpopo-Request-Id" }
            Retry-After: { $ref: "#/components/headers/Retry-After" }
          content:
            application/json:
