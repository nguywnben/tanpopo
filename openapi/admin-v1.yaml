            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }

  /admin/v1/traces/{requestId}/debug-payload:
    get:
      tags: [TracesAndFinOps]
      operationId: getTraceDebugPayload
      summary: Inspect short-lived (<= 72h) Project-DEK-encrypted opt-in debug payload (emits immutable trace.debug_payload_viewed audit event) (SCR-11)
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Audited opt-in debug payload
          content:
            application/json:
              schema:
                type: object
                required: [request_id, expires_at, payload]
                properties:
                  request_id: { type: string }
                  expires_at: { type: string, format: date-time }
                  payload: { type: object }

  /admin/v1/budgets:
    get:
      tags: [TracesAndFinOps]
      operationId: listBudgets
      summary: List hierarchical micro-USD budgets, settled balances, and active pre-request holds (SCR-12)
      parameters:
        - $ref: "#/components/parameters/ProjectIdQueryParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Budgets list
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/BudgetResource" } }
                  next_cursor: { type: ["string", "null"] }
                  has_more: { type: boolean }

  /admin/v1/budgets/{budgetId}:
    put:
      tags: [TracesAndFinOps]
      operationId: updateBudget
      summary: Configure hard/soft integer micro-USD budget ceilings (SCR-12)
      parameters:
        - name: budgetId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IfMatchHeader"
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hard_limit_micros, period]
              properties:
                hard_limit_micros: { type: integer, minimum: 0 }
                period: { type: string, enum: [DAILY, MONTHLY] }
                soft_warning_percents: { type: array, items: { type: integer } }
      responses:
        "200":
          description: Updated BudgetResource
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetResource" }
        "409":
          description: optimistic_lock_conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }

  /admin/v1/usage/summary:
    get:
      tags: [TracesAndFinOps]
      operationId: getUsageChargebackSummary
      summary: Grouped FinOps chargeback rollup separating EXACT, ESTIMATED, and UNMETERED_FLAGGED (SCR-12)
      parameters:
        - name: group_by
          in: query
          required: true
          schema: { type: string, enum: [project, env, key, model] }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Partitioned chargeback summary
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/UsageChargebackRow" } }

  /admin/v1/usage/export:
    get:
      tags: [TracesAndFinOps]
      operationId: exportUsageChargeback
      summary: Export CSV or JSON chargeback report (CSV cells formula-injection sanitized) (SCR-12)
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [csv, json], default: csv }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Chargeback export stream
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UsageChargebackRow" }

  /admin/v1/webhooks:
    get:
      tags: [TracesAndFinOps]
      operationId: listWebhookSubscriptions
      summary: List HMAC-signed budget and HITL approval webhook subscriptions (SCR-12, SCR-14 — v0.2, CR-09)
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Webhook subscriptions
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data: { type: array, items: { type: object } }
                  next_cursor: { type: ["string", "null"] }
                  has_more: { type: boolean }
    post:
      tags: [TracesAndFinOps]
      operationId: createWebhookSubscription
      summary: Register HMAC-signed webhook subscription bound to a vault secret_id (SCR-12, SCR-14 — v0.2, CR-09)
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_url, events, signing_credential_id]
              properties:
                target_url: { type: string, format: uri }
                events: { type: array, items: { type: string } }
                signing_credential_id: { type: string }
      responses:
        "201":
          description: Webhook subscription created
          content:
            application/json:
              schema: { type: object }

  # ==================== GROUP K: SECURITY CENTER — APPROVALS, AUDIT & KILL-SWITCH (SCR-14) ====================
  /admin/v1/approvals:
    get:
      tags: [SecurityCenter]
      operationId: listApprovalRequests
      summary: Cursor-paginated HITL Approval Queue (SM-06) (SCR-14)
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [PENDING, APPROVED, CONSUMED, REJECTED, EXPIRED] }
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated approval requests
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ApprovalRequestResource" } }
                  next_cursor: { type: ["string", "null"] }
                  has_more: { type: boolean }

  /admin/v1/approvals/{approvalId}/decide:
    post:
      tags: [SecurityCenter]
      operationId: decideApprovalRequest
      summary: Approve or reject pending MCP destructive tool call or extension escalation (Four-Eyes enforced — AUTH-12) (SCR-14)
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IfMatchHeader"
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, expected_binding_hash]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                expected_binding_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
                reason: { type: string, minLength: 5 }
      responses:
        "200":
          description: Approval decision committed
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequestResource" }
        "403":
          description: 403 self_approval_forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }
        "409":
          description: 409 approval_already_decided_or_expired or optimistic_lock_conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }

  /admin/v1/audit-events:
    get:
      tags: [SecurityCenter]
      operationId: listAuditEvents
      summary: Cursor-paginated Per-Org + SYSTEM JCS hash-chained Audit Log (SCR-14)
      parameters:
        - name: actor
          in: query
          required: false
          schema: { type: string }
        - name: action
          in: query
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditEventResource" } }
                  next_cursor: { type: ["string", "null"] }
                  has_more: { type: boolean }

  /admin/v1/audit-events/verify:
    post:
      tags: [SecurityCenter]
      operationId: verifyAuditHashChain
      summary: Verify cryptographic SHA-256 JCS hash-chain continuity across Per-Org / SYSTEM audit partitions (SCR-14)
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      responses:
        "200":
          description: Verification report
          content:
            application/json:
              schema:
                type: object
                required: [intact, checked_events_count]
                properties:
                  intact: { type: boolean }
                  checked_events_count: { type: integer }
                  first_broken_seq_no: { type: ["integer", "null"] }

  /admin/v1/kill-switches:
    post:
      tags: [SecurityCenter]
      operationId: triggerKillSwitch
      summary: Trigger 4-level emergency Kill-Switch (VIRTUAL_KEY | PROJECT | PROVIDER_CONNECTION | EXTENSION) (< 1s single-node / < 5s HA TARGET / UNVERIFIED) (SCR-07, SCR-14)
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KillSwitchTriggerRequest" }
      responses:
        "200":
          description: Kill-Switch propagated and logged to immutable audit chain
          content:
            application/json:
              schema:
                type: object
                required: [config_epoch, severed_streams_count, affected_entities_count]
                properties:
                  config_epoch: { type: integer }
                  severed_streams_count: { type: integer }
                  affected_entities_count: { type: integer }

  /admin/v1/blast-radius:
    get:
      tags: [SecurityCenter]
      operationId: queryBlastRadius
      summary: Enumerate Keys, Projects, and Connections that traversed a quarantined Extension or compromised Connection (SCR-14)
      parameters:
        - name: target_type
          in: query
          required: true
          schema: { type: string, enum: [EXTENSION, PROVIDER_CONNECTION] }
        - name: target_id
          in: query
          required: true
          schema: { type: string }
        - name: since
          in: query
          required: false
          schema: { type: string, default: 168h }
      responses:
        "200":
          description: Forensic blast-radius inventory
          content:
            application/json:
              schema:
                type: object
                required: [organizations, projects, virtual_keys, connections]
                properties:
                  organizations: { type: array, items: { type: string } }
                  projects: { type: array, items: { type: string } }
                  virtual_keys: { type: array, items: { type: string } }
                  connections: { type: array, items: { type: string } }

  # ==================== GROUP L: PLAYGROUND, DEVTOOLS & INSTANCE OPS (SCR-15, SCR-16) ====================
  /admin/v1/playground/sessions:
    post:
      tags: [DevToolsAndOps]
      operationId: createPlaygroundSession
      summary: Mint short-lived (TTL <= 15m), cost-capped ephemeral Virtual Key for SCR-15 Playground (CR-10; denied to FINOPS_VIEWER)
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaygroundSessionCreateRequest" }
      responses:
        "201":
          description: Ephemeral Playground Virtual Key minted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaygroundSessionResponse" }
        "403":
          description: Forbidden for FINOPS_VIEWER or unauthorized project scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }

  /admin/v1/openapi.json:
    get:
      tags: [DevToolsAndOps]
      operationId: getEmbeddedOpenApiBundle
      summary: Serve binary-embedded OpenAPI 3.1 contract bundle for Air-Gap API Explorer (SCR-15)
      responses:
        "200":
          description: Bundled OpenAPI 3.1 JSON document
          content:
            application/json:
              schema: { type: object }

  /admin/v1/diagnostics/smoke-test:
    post:
      tags: [DevToolsAndOps]
      operationId: runSmokeDiagnostic
      summary: Run Virtual Key / Connection / Route smoke diagnostic (SCR-15)
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [check_kind, target_id]
              properties:
                check_kind: { type: string, enum: [VIRTUAL_KEY, CONNECTION, ROUTE] }
                target_id: { type: string }
      responses:
        "200":
          description: Smoke diagnostic result
          content:
            application/json:
              schema:
                type: object
                required: [passed, checks]
                properties:
                  passed: { type: boolean }
                  checks: { type: array, items: { type: object } }

  /admin/v1/diagnostics/support-bundle:
    post:
      tags: [DevToolsAndOps]
      operationId: createRedactedSupportBundle
      summary: Export multi-pass secret- and PII-scrubbed diagnostic archive (OPERATOR only — OPS-AC-10) (SCR-15)
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                since: { type: string, default: 2h }
      responses:
        "200":
          description: Redacted tar.gz diagnostic bundle
          content:
            application/gzip:
              schema: { type: string, format: binary }

  /admin/v1/ops/cluster-status:
    get:
      tags: [DevToolsAndOps]
      operationId: getClusterOpsStatus
      summary: Inspect Data Plane node ConfigSnapshot epoch lag, DB/Valkey/KMS posture, and Wasm pool stats (OPERATOR only) (SCR-16)
      responses:
        "200":
          description: Cluster operational status
          content:
            application/json:
              schema:
                type: object
                required: [current_epoch, storage_engine, nodes]
                properties:
                  current_epoch: { type: integer }
                  storage_engine: { type: string, enum: [sqlite_wal, postgres] }
                  nodes: { type: array, items: { type: object } }

  /admin/v1/ops/backups:
    post:
      tags: [DevToolsAndOps]
      operationId: triggerEncryptedBackup
      summary: Trigger hot Master-KEK-sealed .tpop.enc backup archive (OPERATOR only) (SCR-16)
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Encrypted .tpop.enc backup receipt
          content:
            application/json:
              schema:
                type: object
                required: [backup_id, archive_filename, sha256_hex, size_bytes, created_at]
                properties:
                  backup_id: { type: string }
                  archive_filename: { type: string, examples: [tanpopo-backup-20261114.tpop.enc] }
                  sha256_hex: { type: string, pattern: "^[a-f0-9]{64}$" }
                  size_bytes: { type: integer }
                  created_at: { type: string, format: date-time }

  /admin/v1/ops/upgrades/preflight:
    post:
      tags: [DevToolsAndOps]
      operationId: runUpgradePreflight
      summary: Verify contractVersion compatibility across all ENABLED_ACTIVE extensions prior to Core upgrade (SM-08, SCR-16)
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_core_version]
              properties:
                target_core_version: { type: string, examples: [v0.2.0] }
      responses:
        "200":
          description: Upgrade preflight compatibility verdict
          content:
            application/json:
              schema:
                type: object
                required: [compatible, state, blocking_extensions]
                properties:
                  compatible: { type: boolean }
                  state: { type: string, enum: [READY_TO_UPGRADE, BLOCKED_INCOMPATIBLE] }
                  blocking_extensions: { type: array, items: { type: object } }

  /admin/v1/settings/retention:
    put:
      tags: [DevToolsAndOps]
      operationId: updateRetentionSettings
      summary: Configure automatic TTL purge windows (opt-in debug payload TTL <= 72h; audit floor >= 365d) (SCR-16)
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trace_metadata_ttl_days, audit_ledger_ttl_days, debug_payload_capture_enabled, debug_payload_ttl_hours]
              properties:
                trace_metadata_ttl_days: { type: integer, minimum: 1, maximum: 90, default: 30 }
                audit_ledger_ttl_days: { type: integer, minimum: 365 }
                debug_payload_capture_enabled: { type: boolean, default: false }
                debug_payload_ttl_hours: { type: integer, minimum: 1, maximum: 72, default: 24 }
      responses:
        "200":
          description: Retention settings updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { type: object }
        "409":
          description: optimistic_lock_conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalErrorEnvelope" }
