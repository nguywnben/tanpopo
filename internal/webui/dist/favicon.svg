<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" role="img" aria-label="Tanpopo Favicon">
  <rect x="0.375" y="0.375" width="15.25" height="15.25" rx="3.4" fill="#141417" stroke="#2c2c32" stroke-width="0.75"/>
  <!-- Central gateway hub snapped to pixel center (7.5, 8.5) -->
  <circle cx="7.5" cy="8.5" r="1.7" fill="#ffffff"/>
  <!-- All 5 anchored dandelion spokes at exact 60-degree intervals -->
  <g stroke="#ffffff" stroke-width="1.25" stroke-linecap="round">
    <line x1="7.5" y1="5.2" x2="7.5" y2="3.0"/>
    <line x1="4.64" y1="6.85" x2="2.74" y2="5.75"/>
    <line x1="4.64" y1="10.15" x2="2.74" y2="11.25"/>
    <line x1="7.5" y1="11.8" x2="7.5" y2="14.0"/>
    <line x1="10.36" y1="10.15" x2="12.26" y2="11.25"/>
  </g>
  <!-- 1 detached drifting dandelion seed at 30-degree ENE (separated gray stem + bright white seed) -->
  <line x1="10.35" y1="6.85" x2="11.2" y2="6.36" stroke="#a1a1aa" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="13.05" cy="5.3" r="1.3" fill="#ffffff"/>
</svg>
