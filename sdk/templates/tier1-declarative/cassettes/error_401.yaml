case_id: "ct16_error_401_no_secret_echo"
description: "Verifies 401 auth error normalization without echoing vault canary secrets."
capability: "error_normalization"
config:
  endpoint_base_url: "https://api.openai.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "gpt-4o-mini"
  stream: false
  messages:
    - role: "user"
      content: "Ping"
upstream_recorded_exchange:
  status: 401
  headers:
    content-type: "application/json"
  raw_body: '{"error":{"code":"invalid_api_key","message":"Incorrect API key provided."}}'
expected_canonical_error:
  canonical_code: "upstream_auth_failed"
  trigger_reauth: true
  retryable_pre_stream: false
