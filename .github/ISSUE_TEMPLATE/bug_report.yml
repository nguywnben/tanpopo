name: Bug Report
description: Report reproducible unexpected behavior in Tanpopo CLI, runtime, or Web Console
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal config (redact secrets/keys), CLI commands, or API request.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Tanpopo commit / version (`tanpopo version`):
        - OS & architecture:
        - Deployment mode (`serve` local SQLite / PostgreSQL + Valkey HA / Docker / Kubernetes):
        - Go / browser version (if applicable):
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: text
