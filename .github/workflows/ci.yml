#
# Hermetic Stage 0 & Stage 1 CI Pipeline (TP-IMP-0005 / SPEC-QA-02).
# Zero external Internet AI API calls; pre-seeded with CANARY_FORBIDDEN_CI_KEY traps.
# All third-party Actions are pinned to immutable 40-char commit SHAs.

name: CI (Stage 0-1 Contract, Floor, Supply-Chain & Small Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TANPOPO_TEST_HERMETIC: "1"
  OPENAI_API_KEY: CANARY_FORBIDDEN_CI_KEY
  ANTHROPIC_API_KEY: CANARY_FORBIDDEN_CI_KEY
  GEMINI_API_KEY: CANARY_FORBIDDEN_CI_KEY

jobs:
  stage0-contract-floor-supply-chain:
    name: Stage 0 — Contract, Floor Guard, Astryx & License Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go 1.24
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: |
            go.mod
            tools/spikes/go.mod

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/console/package-lock.json

      - name: Verify Floor Guard, DAG, License, Lockfiles, UI Layout & Canary Hygiene
        run: go run ./scripts/ci/check.go --dag --floor-guard --license --lockfiles --ui-layout --canary

      - name: Verify M0 Machine-Readable Contracts (runtime.proto, OpenAPI 3.1, SQLite DDL)
        working-directory: tools/spikes
        run: CGO_ENABLED=0 go test -count=1 -v -run 'Test(ContractProtoCompilesCleanly|OpenAPISpecsParseAndResolveAllInternalRefs|PhysicalSQLiteAndPostgresSchemaParityAndConstraints|HermeticGuardBlocksExternalEgress)' ./...

      - name: Install Web Console dependencies (Default-Deny lifecycle scripts)
        working-directory: web/console
        run: npm ci --ignore-scripts

      - name: Audit Production Web Console Dependencies
        working-directory: web/console
        run: npm audit --omit=dev --audit-level=high

      - name: Run Astryx Doctor & Conditional TypeScript Check
        working-directory: web/console
        run: |
          npx --no -- @astryxdesign/cli doctor
          if [ -f tsconfig.json ]; then
            npm run typecheck
          fi

      - name: Setup Buf & Lint Protobuf Contracts
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run buf lint on proto/
        run: buf lint

  stage1-static-build-and-small-tests:
    name: Stage 1 — Pure-Go Build & Small Tests (${{ matrix.os }})
    needs: stage0-contract-floor-supply-chain
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go 1.24
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: go.mod

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/console/package-lock.json

      - name: Download & Verify Go Module Dependencies (Before Offline Hermetic Tests)
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify

      - name: Run Hermetic Go Quality Gates, Pure-Go & Race Tests Inside OS Network Namespace (ubuntu-24.04)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v unshare >/dev/null 2>&1 || ! command -v ip >/dev/null 2>&1 || ! command -v setpriv >/dev/null 2>&1; then
            echo "ERROR: required OS isolation tools (unshare/ip/setpriv) unavailable; failing closed" >&2
            exit 1
          fi
          if ! sudo -n true 2>/dev/null; then
            echo "ERROR: passwordless sudo required for unshare --net on Ubuntu 24.04; failing closed" >&2
            exit 1
          fi
          TARGET_UID="$(id -u)"
          TARGET_GID="$(id -g)"
          GO_GOPATH="$(go env GOPATH)"
          GO_CACHE="$(go env GOCACHE)"
          GO_MODCACHE="$(go env GOMODCACHE)"
          sudo -n env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "GOPATH=$GO_GOPATH" \
            "GOCACHE=$GO_CACHE" \
            "GOMODCACHE=$GO_MODCACHE" \
            "TARGET_UID=$TARGET_UID" \
            "TARGET_GID=$TARGET_GID" \
            "OPENAI_API_KEY=${{ env.OPENAI_API_KEY }}" \
            "ANTHROPIC_API_KEY=${{ env.ANTHROPIC_API_KEY }}" \
            "GEMINI_API_KEY=${{ env.GEMINI_API_KEY }}" \
            "TANPOPO_TEST_HERMETIC=1" \
            "TANPOPO_OS_NETNS_ISOLATED=1" \
            "GOPROXY=off" \
            "GITHUB_ACTIONS=${GITHUB_ACTIONS:-false}" \
            unshare --net -- bash -euo pipefail -c '
              ip link set lo up
              NON_LO=$(ip -o link show | cut -d: -f2 | tr -d " " | cut -d@ -f1 | grep -vx "lo" || true)
              if [ -n "$NON_LO" ]; then
                echo "ERROR: unexpected non-loopback network interface in isolated namespace: $NON_LO" >&2
                exit 1
              fi
              if ip route show | grep -q .; then
                echo "ERROR: unexpected routing entry in isolated namespace" >&2
                ip route show >&2
                exit 1
              fi
              exec setpriv --reuid="$TARGET_UID" --regid="$TARGET_GID" --init-groups bash -euo pipefail -s
            ' <<'USER_EOF'
          set -euo pipefail
          echo "Verified non-root uid=$(id -u) gid=$(id -g) inside loopback-only Linux netns (TANPOPO_OS_NETNS_ISOLATED=$TANPOPO_OS_NETNS_ISOLATED)"
          CGO_ENABLED=0 go run ./scripts/ci/check.go --all
          CGO_ENABLED=0 go test -v -short ./...
          CGO_ENABLED=0 go test -v -count=3 ./internal/testkit/...
          CGO_ENABLED=0 go run ./cmd/tanpopo --version
          go test -v -race -short ./...
          go test -v -race -count=3 -coverprofile=/tmp/testkit-linux.cov ./internal/testkit/...
          TOTAL_COV=$(go tool cover -func=/tmp/testkit-linux.cov | awk '/^total:/ {print $NF}' | tr -d '%')
          echo "Linux -race -count=3 ./internal/testkit/... statement coverage: ${TOTAL_COV}%"
          awk -v cov="$TOTAL_COV" 'BEGIN { if (cov + 0 < 90.0) { printf "Coverage %.1f%% < 90.0%% DoD threshold\n", cov; exit 1 } }'
          go test -v -race -count=1 -coverprofile=/tmp/storage-linux.cov ./internal/storage/...
          STORAGE_COV=$(go tool cover -func=/tmp/storage-linux.cov | awk '/^total:/ {print $NF}' | tr -d '%')
          echo "Linux -race ./internal/storage/... statement coverage: ${STORAGE_COV}%"
          awk -v cov="$STORAGE_COV" 'BEGIN { if (cov + 0 < 85.0) { printf "Storage coverage %.1f%% < 85.0%% TP-IMP-0007 DoD threshold\n", cov; exit 1 } }'
          USER_EOF

      - name: Run All Go Quality Gates & Pure-Go Build (CGO_ENABLED=0 — macOS & Windows In-Process netguard)
        if: matrix.os != 'ubuntu-24.04'
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go run ./scripts/ci/check.go --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v -short ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v -count=3 ./internal/testkit/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify tanpopo CLI Version Stub Under CGO_ENABLED=0 (macOS & Windows)
        if: matrix.os != 'ubuntu-24.04'
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go run ./cmd/tanpopo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Race Detector Tests & Coverage (-race -count=3 on macOS C Toolchain)
        if: matrix.os == 'macos-15'
        run: |
          set -euo pipefail
          go test -v -race -short ./...
          go test -v -race -count=3 -coverprofile=/tmp/testkit-macos.cov ./internal/testkit/...
          TOTAL_COV=$(go tool cover -func=/tmp/testkit-macos.cov | awk '/^total:/ {print $NF}' | tr -d '%')
          echo "macOS -race -count=3 ./internal/testkit/... statement coverage: ${TOTAL_COV}%"
          awk -v cov="$TOTAL_COV" 'BEGIN { if (cov + 0 < 90.0) { printf "Coverage %.1f%% < 90.0%% DoD threshold\n", cov; exit 1 } }'
          go test -v -race -count=1 -coverprofile=/tmp/storage-macos.cov ./internal/storage/...
          STORAGE_COV=$(go tool cover -func=/tmp/storage-macos.cov | awk '/^total:/ {print $NF}' | tr -d '%')
          echo "macOS -race ./internal/storage/... statement coverage: ${STORAGE_COV}%"
          awk -v cov="$STORAGE_COV" 'BEGIN { if (cov + 0 < 85.0) { printf "Storage coverage %.1f%% < 85.0%% TP-IMP-0007 DoD threshold\n", cov; exit 1 } }'

      - name: Run Web Console npm ci --ignore-scripts & Astryx Doctor Across All OS Runners
        working-directory: web/console
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no -- @astryxdesign/cli doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
