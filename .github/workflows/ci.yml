#
# Hermetic Stage 0 & Stage 1 CI Pipeline (TP-IMP-0005 / SPEC-QA-02).
# Zero external Internet AI API calls; pre-seeded with CANARY_FORBIDDEN_CI_KEY traps.
# All third-party Actions are pinned to immutable 40-char commit SHAs.

name: CI (Stage 0-1 Contract, Floor, Supply-Chain & Small Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TANPOPO_TEST_HERMETIC: "1"
  OPENAI_API_KEY: CANARY_FORBIDDEN_CI_KEY
  ANTHROPIC_API_KEY: CANARY_FORBIDDEN_CI_KEY
  GEMINI_API_KEY: CANARY_FORBIDDEN_CI_KEY

jobs:
  stage0-contract-floor-supply-chain:
    name: Stage 0 — Contract, Floor Guard, Astryx & License Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go 1.24
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.mod
            tools/spikes/go.mod

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/console/package-lock.json

      - name: Diagnostic placeholder
        run: echo "diag stage0"

  stage1-static-build-and-small-tests:
    name: Stage 1 — Pure-Go Build & Small Tests (${{ matrix.os }})
    needs: stage0-contract-floor-supply-chain
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go 1.24
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.mod

      - name: Diag Cross-OS Builtin Digests and Owner Manifest Verify
        shell: bash
        run: |
          set -uo pipefail
          go version
          git ls-files --eol extensions/official/cohere-rerank/
          CGO_ENABLED=0 go test -v ./internal/extension/builtin -run '^TestDiagBuiltinDigests$'
          TMP_PUB=$(mktemp)
          printf 'f53499efe485a10dade51fda4a84b514cb73cbdc83e86dd2c78b81fd20771808' > "$TMP_PUB"
          CGO_ENABLED=0 go run ./cmd/tanpopo plugin release-verify --signatures extensions/official/release-signatures.json --root-pubkey-file "$TMP_PUB" --builtin || echo "VERIFY_FAILED"
          rm -f "$TMP_PUB"
