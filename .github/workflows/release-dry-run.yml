name: Release Artifact Dry Run

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-artifacts:
    name: Cross-platform, OCI, SBOM & signing dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go 1.24
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.mod

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/console/package-lock.json

      - name: Install release verification tools
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/goreleaser/goreleaser/v2@v2.6.1
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.8.0
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/aquasecurity/trivy/cmd/trivy@v0.58.1
          npm install --global --ignore-scripts @cyclonedx/cyclonedx-npm@4.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download and audit web dependencies
        working-directory: web/console
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Verify release artifacts without publishing
        run: bash scripts/release/verify-artifacts.sh

      - name: Upload verified artifacts for trusted provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tanpopo-verified-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  attest-provenance:
    name: Attest trusted main artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-artifacts
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tanpopo-verified-artifacts
          path: dist

      - name: Attest packaged artifacts with GitHub OIDC provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - name: Verify every attested subject and trusted source identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for subject in dist/*; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-dry-run.yml" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA"
          done
