case_id: "azure_openai_error_403"
description: "Verifies Azure 403 maps to reauthentication without exposing the key."
capability: "error_normalization"
config:
  endpoint_base_url: "https://tanpopo-resource.openai.azure.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "gpt-4o-prod"
  stream: false
  messages:
    - role: "user"
      content: "ping"
upstream_recorded_exchange:
  status: 403
  headers:
    content-type: "application/json"
  expected_upstream_headers:
    api-key: "__CANARY_SECRET__"
  raw_body: '{"error":{"code":"Forbidden","message":"The caller is not authorized."}}'
expected_canonical_error:
  canonical_code: "upstream_auth_failed"
  error_type: "authentication_error"
  retryable_pre_stream: false
  trigger_reauth: true
  message_must_not_contain:
    - "__CANARY_SECRET__"
