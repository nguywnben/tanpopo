case_id: "azure_openai_error_429"
description: "Verifies Azure throttling maps to a retryable upstream rate-limit error."
capability: "error_normalization"
config:
  endpoint_base_url: "https://tanpopo-resource.openai.azure.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "gpt-4o-prod"
  stream: false
  messages:
    - role: "user"
      content: "ping"
upstream_recorded_exchange:
  status: 429
  headers:
    content-type: "application/json"
    retry-after: "2"
  expected_upstream_headers:
    api-key: "__CANARY_SECRET__"
  raw_body: '{"error":{"code":"TooManyRequests","message":"Rate limit is exceeded."}}'
expected_canonical_error:
  canonical_code: "upstream_rate_limited"
  error_type: "rate_limit_error"
  retryable_pre_stream: true
  trigger_reauth: false
