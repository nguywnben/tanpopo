case_id: "azure_openai_chat_stream"
description: "Exercises OpenAI-compatible Azure SSE chunks, terminal usage, and api-key header injection."
capability: "chat_stream"
config:
  endpoint_base_url: "https://tanpopo-resource.openai.azure.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "gpt-4o-prod"
  stream: true
  messages:
    - role: "user"
      content: "Say hello."
upstream_recorded_exchange:
  status: 200
  headers:
    content-type: "text/event-stream"
  expected_upstream_headers:
    api-key: "__CANARY_SECRET__"
  raw_sse_chunks:
