case_id: "azure_openai_chat_sync"
description: "Exercises deployment-scoped sync chat, pinned API version, usage extraction, and api-key header injection."
capability: "chat_completion"
config:
  endpoint_base_url: "https://tanpopo-resource.openai.azure.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "gpt-4o-prod"
  stream: false
  messages:
    - role: "user"
      content: "Say hello."
upstream_recorded_exchange:
  status: 200
  headers:
    content-type: "application/json"
  expected_upstream_headers:
    api-key: "__CANARY_SECRET__"
  raw_body: '{"id":"chatcmpl-az-sync-1","object":"chat.completion","model":"gpt-4o-prod","choices":[{"index":0,"message":{"role":"assistant","content":"Hello from Azure."},"finish_reason":"stop"}],"usage":{"prompt_tokens":20,"completion_tokens":6}}'
expected_normalized_output:
  model: "gpt-4o-prod"
  finish_reason: "stop"
  content: "Hello from Azure."
  require_usage: true
  input_tokens: 20
  output_tokens: 6
