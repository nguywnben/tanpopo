case_id: "azure_openai_error_500"
description: "Verifies Azure server failures map to a retryable upstream error."
capability: "error_normalization"
config:
  endpoint_base_url: "https://tanpopo-resource.openai.azure.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "gpt-4o-prod"
  stream: false
  messages:
    - role: "user"
      content: "ping"
upstream_recorded_exchange:
  status: 500
  headers:
    content-type: "application/json"
  expected_upstream_headers:
    api-key: "__CANARY_SECRET__"
  raw_body: '{"error":{"code":"InternalServerError","message":"The service is temporarily unavailable."}}'
expected_canonical_error:
  canonical_code: "internalservererror"
  error_type: "server_error"
  retryable_pre_stream: true
  trigger_reauth: false
