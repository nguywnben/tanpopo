case_id: "gemini_tool_calls"
description: "Verifies Gemini functionDeclarations and functionCall response translation."
capability: "tool_calling"
config:
  endpoint_base_url: "https://generativelanguage.googleapis.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "gemini-2.5-flash"
  messages:
    - role: "user"
      content: "Weather in Tokyo?"
  tools:
    - type: "function"
      function:
        name: "get_weather"
        description: "Fetch weather"
        parameters:
          type: "object"
          properties:
            city:
              type: "string"
  tool_choice: "auto"
upstream_recorded_exchange:
  status: 200
  headers:
    content-type: "application/json"
  expected_upstream_headers:
    x-goog-api-key: "__CANARY_SECRET__"
  raw_body: '{"modelVersion":"gemini-2.5-flash","candidates":[{"content":{"role":"model","parts":[{"functionCall":{"name":"get_weather","args":{"city":"Tokyo"}}}]},"finishReason":"STOP"}],"usageMetadata":{"promptTokenCount":24,"candidatesTokenCount":12}}'
expected_normalized_output:
  model: "gemini-2.5-flash"
  finish_reason: "tool_calls"
  tool_calls_count: 1
  tool_call_name: "get_weather"
  tool_call_arguments: '{"city":"Tokyo"}'
  require_usage: true
  input_tokens: 24
  output_tokens: 12
