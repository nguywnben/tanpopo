case_id: "gemini_error_429"
description: "Verifies Gemini 429 maps to retryable rate_limit_exceeded."
capability: "error_normalization"
config:
  endpoint_base_url: "https://generativelanguage.googleapis.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "gemini-2.5-flash"
  messages:
    - role: "user"
      content: "hi"
upstream_recorded_exchange:
  status: 429
  headers:
    content-type: "application/json"
    retry-after: "4"
  raw_body: '{"error":{"code":429,"message":"Resource has been exhausted.","status":"RESOURCE_EXHAUSTED"}}'
expected_canonical_error:
  canonical_code: "rate_limit_exceeded"
  error_type: "rate_limit_error"
  retryable_pre_stream: true
  trigger_reauth: false
