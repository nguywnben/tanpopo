case_id: "aws_bedrock_chat_sync"
description: "OpenAI chat request and Bedrock Converse response contract, with host-only SigV4 credential signing."
capability: "chat_completion"
config:
  aws_region: "us-east-1"
  endpoint_base_url: "https://bedrock-runtime.us-east-1.amazonaws.com"
secret_slots:
  aws_credentials: "__CANARY_SECRET__"
normalized_input:
  model: "anthropic.claude-3-5-sonnet-20241022-v2:0"
  max_tokens: 128
  temperature: 0.2
  messages:
    - role: "system"
      content: "Be concise."
    - role: "user"
      content: "Say pong"
upstream_recorded_exchange:
  status: 200
  headers:
    content-type: "application/json"
  expected_upstream_headers:
    content-type: "application/json"
  raw_body: '{"output":{"message":{"role":"assistant","content":[{"text":"pong"}]}},"stopReason":"end_turn","usage":{"inputTokens":18,"outputTokens":3,"totalTokens":21},"metrics":{"latencyMs":42},"$metadata":{"requestId":"req_example"}}'
expected_normalized_output:
  finish_reason: "stop"
  content: "pong"
  require_usage: true
  input_tokens: 18
  output_tokens: 3
