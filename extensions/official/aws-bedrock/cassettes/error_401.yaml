case_id: "aws_bedrock_error_401"
description: "Bedrock 401 authentication failure triggers reauthentication and sanitizes the upstream message."
capability: "error_normalization"
config:
  aws_region: "us-east-1"
secret_slots:
  aws_credentials: "__CANARY_SECRET__"
normalized_input:
  model: "anthropic.claude-3-5-sonnet-20241022-v2:0"
  messages:
    - role: "user"
      content: "Say pong"
upstream_recorded_exchange:
  status: 401
  headers:
    content-type: "application/json"
  raw_body: '{"message":"The request signature we calculated does not match.","__type":"UnauthorizedException"}'
expected_canonical_error:
  canonical_code: "authentication_error"
  error_type: "authentication_error"
  retryable_pre_stream: false
  trigger_reauth: true
  message_must_not_contain:
    - "__CANARY_SECRET__"
