case_id: "aws_bedrock_error_500"
description: "Bedrock server failures normalize as retryable upstream errors."
capability: "error_normalization"
config:
  aws_region: "us-east-1"
secret_slots:
  aws_credentials: "__CANARY_SECRET__"
normalized_input:
  model: "anthropic.claude-3-5-sonnet-20241022-v2:0"
  messages:
    - role: "user"
      content: "Say pong"
upstream_recorded_exchange:
  status: 500
  headers:
    content-type: "application/json"
  raw_body: '{"message":"Internal service error.","__type":"InternalServerException"}'
expected_canonical_error:
  canonical_code: "upstream_server_error"
  error_type: "upstream_error"
  retryable_pre_stream: true
  trigger_reauth: false
