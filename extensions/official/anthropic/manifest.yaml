apiVersion: tanpopo.dev/extension/v1alpha1
kind: ExtensionManifest

metadata:
  id: "@tanpopo/anthropic"
  name: "Anthropic Official Adapter"
  version: "0.1.0"
  license: "Apache-2.0"
  originTrustTier: "official"
  description: "Official Tanpopo Tier-2 sandboxed WebAssembly 1.0 adapter for Anthropic Messages API (/v1/messages, system extraction, tool_use/tool_result, image/PDF blob_ref splicing, stateful SSE normalization, and /native/anthropic/*)."

compatibility:
  contractVersion: "0.1"
  coreVersionRange: ">=0.1.0 <0.3.0"

runtime:
  tier: "sandboxed_wasm"
  entrypoint: "dist/adapter.wasm"
  sha256: "9a50b80f7a4b9718c5d62f758761c20de929e271f041d3b655525c0af1ff5a93"
  quotas:
    maxMemoryMib: 16
    maxCpuMsPerCall: 50
    maxStreamChunkCpuMs: 50

capabilities:
  - type: "provider_adapter"
    adapterSlug: "anthropic"
    supportedDialects:
      - "anthropic_messages"
      - "anthropic"
      - "openai_chat"
    nativePassthroughPrefix: "/native/anthropic"
    allowedNativePaths:
      - "^v1/messages$"
      - "^v1/messages/count_tokens$"
      - "^v1/models$"
    allowedNativeHeaders:
      - "anthropic-version"
      - "anthropic-beta"
    authMethods:
      - id: "x_api_key"
        mode: "host_blind_inject"
        headerName: "x-api-key"

secretSlots:
  - slot: "api_key"
    requiredForAuthMethods:
      - "x_api_key"

permissions:
  networkEgress:
    allowedHosts:
      - "api.anthropic.com"
    allowPrivateIp: false
    requireTls: true
  hooks:
    - "provider:build_validation_probe"
    - "provider:verify_validation_result"
    - "provider:transform_request"
    - "provider:transform_response"
    - "provider:transform_stream_chunk"
    - "provider:normalize_error"
    - "provider:extract_usage"
    - "provider:inspect_native_request"
    - "guardrail:evaluate_guardrail"
  payloadAccess:
    inspectRequestBody: true
    inspectResponseBody: true
    maxInlineMetadataBytes: 65536
