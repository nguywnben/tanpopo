case_id: "anthropic_chat_sync"
description: "Verifies bidirectional system extraction, sync Messages response translation, and exact Anthropic cache usage."
capability: "chat_completion"
config:
  endpoint_base_url: "https://api.anthropic.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "claude-sonnet-4-5"
  max_tokens: 256
  messages:
    - role: "system"
      content: "You are concise."
    - role: "user"
      content: "Say pong"
upstream_recorded_exchange:
  status: 200
  headers:
    content-type: "application/json"
  expected_upstream_headers:
    x-api-key: "__CANARY_SECRET__"
    anthropic-version: "2023-06-01"
  raw_body: '{"id":"msg_anth_1","type":"message","role":"assistant","model":"claude-sonnet-4-5","content":[{"type":"text","text":"pong"}],"stop_reason":"end_turn","usage":{"input_tokens":18,"output_tokens":3,"cache_read_input_tokens":10,"cache_creation_input_tokens":4}}'
expected_normalized_output:
  model: "claude-sonnet-4-5"
  finish_reason: "stop"
  content: "pong"
  require_usage: true
  input_tokens: 18
  output_tokens: 3
  cache_read_tokens: 10
