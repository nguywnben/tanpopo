case_id: "anthropic_vision_multimodal"
description: "Verifies multimodal image_url and PDF document translation via Anthropic Messages API."
capability: "chat_completion"
config:
  endpoint_base_url: "https://api.anthropic.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "claude-sonnet-4-5"
  messages:
    - role: "user"
      content:
        - type: "text"
          text: "Summarize image and pdf"
        - type: "image_url"
          image_url:
            url: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
        - type: "input_file"
          file_data: "data:application/pdf;base64,JVBERi0xLjQK"
upstream_recorded_exchange:
  status: 200
  headers:
    content-type: "application/json"
  expected_upstream_headers:
    x-api-key: "__CANARY_SECRET__"
  raw_body: '{"id":"msg_anth_vis","type":"message","role":"assistant","model":"claude-sonnet-4-5","content":[{"type":"text","text":"1px PNG plus PDF header."}],"stop_reason":"end_turn","usage":{"input_tokens":140,"output_tokens":8}}'
expected_normalized_output:
  model: "claude-sonnet-4-5"
  finish_reason: "stop"
  content: "1px PNG plus PDF header."
  require_usage: true
  input_tokens: 140
  output_tokens: 8
