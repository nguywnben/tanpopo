case_id: "anthropic_error_500"
description: "Verifies Anthropic 500 maps to retryable upstream_server_error."
capability: "error_normalization"
config:
  endpoint_base_url: "https://api.anthropic.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "claude-sonnet-4-5"
  messages:
    - role: "user"
      content: "hi"
upstream_recorded_exchange:
  status: 500
  headers:
    content-type: "application/json"
  raw_body: '{"type":"error","error":{"type":"api_error","message":"Internal server error."}}'
expected_canonical_error:
  canonical_code: "upstream_server_error"
  error_type: "upstream_error"
  retryable_pre_stream: true
  trigger_reauth: false
