case_id: "anthropic_tool_calls"
description: "Verifies Anthropic tool_use and stop_reason translation to OpenAI tool_calls."
capability: "tool_calling"
config:
  endpoint_base_url: "https://api.anthropic.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "claude-sonnet-4-5"
  messages:
    - role: "user"
      content: "Weather in Tokyo?"
  tools:
    - type: "function"
      function:
        name: "get_weather"
        description: "Look up weather"
        parameters:
          type: "object"
          properties:
            city:
              type: "string"
  tool_choice: "auto"
upstream_recorded_exchange:
  status: 200
  headers:
    content-type: "application/json"
  expected_upstream_headers:
    x-api-key: "__CANARY_SECRET__"
  raw_body: '{"id":"msg_anth_tc","type":"message","role":"assistant","model":"claude-sonnet-4-5","content":[{"type":"tool_use","id":"toolu_01","name":"get_weather","input":{"city":"Tokyo"}}],"stop_reason":"tool_use","usage":{"input_tokens":28,"output_tokens":16}}'
expected_normalized_output:
  model: "claude-sonnet-4-5"
  finish_reason: "tool_calls"
  tool_calls_count: 1
  tool_call_name: "get_weather"
  tool_call_arguments: '{"city":"Tokyo"}'
  require_usage: true
  input_tokens: 28
  output_tokens: 16
