case_id: "oai_compat_native_passthrough"
description: "Verifies /native/openai-compatible/v1/chat/completions passthrough with vLLM guided_json extras."
capability: "native_passthrough"
config:
  endpoint_base_url: "http://vllm.internal:8000"
  dialect: "openai_chat"
  upstream_path: "v1/chat/completions"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "meta-llama/Llama-3.3-70B-Instruct"
  guided_json:
    type: "object"
  messages:
    - role: "user"
      content: "Return JSON"
upstream_recorded_exchange:
  status: 200
  headers:
    content-type: "application/json"
  expected_upstream_headers:
    authorization: "Bearer __CANARY_SECRET__"
  raw_body: '{"id":"chatcmpl-native-vllm","object":"chat.completion","model":"meta-llama/Llama-3.3-70B-Instruct","choices":[{"index":0,"message":{"role":"assistant","content":"{\"ok\":true}"},"finish_reason":"stop"}],"usage":{"prompt_tokens":21,"completion_tokens":5}}'
expected_normalized_output:
  model: "meta-llama/Llama-3.3-70B-Instruct"
  content_contains: "chatcmpl-native-vllm"
  require_usage: true
  input_tokens: 21
  output_tokens: 5
