case_id: "oai_compat_error_401"
description: "Verifies 401 triggers connection reauth without leaking canary secrets."
capability: "error_normalization"
config:
  endpoint_base_url: "http://vllm.internal:8000"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "meta-llama/Llama-3.3-70B-Instruct"
  stream: false
  messages:
    - role: "user"
      content: "ping"
upstream_recorded_exchange:
  status: 401
  headers:
    content-type: "application/json"
  raw_body: '{"error":{"message":"Invalid internal bearer token","code":"unauthorized"}}'
expected_canonical_error:
  canonical_code: "upstream_auth_failed"
  error_type: "authentication_error"
  retryable_pre_stream: false
  trigger_reauth: true
