case_id: "oai_compat_vllm_chat_sync"
description: "Verifies synchronous /v1/chat/completions against an internal vLLM host."
capability: "chat_completion"
config:
  endpoint_base_url: "http://vllm.internal:8000"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "meta-llama/Llama-3.3-70B-Instruct"
  stream: false
  messages:
    - role: "user"
      content: "Explain static gateways in one sentence."
upstream_recorded_exchange:
  status: 200
  headers:
    content-type: "application/json"
  expected_upstream_headers:
    authorization: "Bearer __CANARY_SECRET__"
  raw_body: '{"id":"chatcmpl-vllm-1","object":"chat.completion","model":"meta-llama/Llama-3.3-70B-Instruct","choices":[{"index":0,"message":{"role":"assistant","content":"A static gateway forwards requests deterministically with bounded overhead."},"finish_reason":"stop"}],"usage":{"prompt_tokens":19,"completion_tokens":11}}'
expected_normalized_output:
  model: "meta-llama/Llama-3.3-70B-Instruct"
  finish_reason: "stop"
  content: "A static gateway forwards requests deterministically with bounded overhead."
  require_usage: true
  input_tokens: 19
  output_tokens: 11
