case_id: "oai_compat_error_500"
description: "Verifies 500 server error enables pre-stream failover."
capability: "error_normalization"
config:
  endpoint_base_url: "http://vllm.internal:8000"
secret_slots: {}
normalized_input:
  model: "meta-llama/Llama-3.3-70B-Instruct"
  stream: false
  messages:
    - role: "user"
      content: "ping"
upstream_recorded_exchange:
  status: 500
  headers:
    content-type: "application/json"
  raw_body: '{"error":{"message":"KV cache allocation failure","code":"internal_server_error"}}'
expected_canonical_error:
  error_type: "server_error"
  retryable_pre_stream: true
  trigger_reauth: false
