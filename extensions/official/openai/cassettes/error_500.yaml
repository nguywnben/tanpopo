case_id: "openai_error_500"
description: "Verifies 500 upstream failure maps to retryable pre-stream server_error."
capability: "error_normalization"
config:
  endpoint_base_url: "https://api.openai.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "gpt-4o"
  stream: false
  messages:
    - role: "user"
      content: "ping"
upstream_recorded_exchange:
  status: 500
  headers:
    content-type: "application/json"
  raw_body: '{"error":{"message":"The server had an error processing your request.","type":"server_error","code":"internal_error"}}'
expected_canonical_error:
  error_type: "server_error"
  retryable_pre_stream: true
  trigger_reauth: false
