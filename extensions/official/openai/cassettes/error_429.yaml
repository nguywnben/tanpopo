case_id: "openai_error_429"
description: "Verifies 429 rate-limit normalization enables pre-stream failover cooldown."
capability: "error_normalization"
config:
  endpoint_base_url: "https://api.openai.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "gpt-4o"
  stream: false
  messages:
    - role: "user"
      content: "ping"
upstream_recorded_exchange:
  status: 429
  headers:
    content-type: "application/json"
    retry-after: "12"
  raw_body: '{"error":{"message":"Rate limit reached for requests per min.","type":"requests","code":"rate_limit_exceeded"}}'
expected_canonical_error:
  canonical_code: "upstream_rate_limited"
  error_type: "rate_limit_error"
  retryable_pre_stream: true
  trigger_reauth: false
