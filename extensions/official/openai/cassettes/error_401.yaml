case_id: "openai_error_401"
description: "Verifies 401 triggers connection reauth without leaking canary secrets."
capability: "error_normalization"
config:
  endpoint_base_url: "https://api.openai.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "gpt-4o"
  stream: false
  messages:
    - role: "user"
      content: "ping"
upstream_recorded_exchange:
  status: 401
  headers:
    content-type: "application/json"
  raw_body: '{"error":{"message":"Incorrect API key provided.","type":"invalid_request_error","code":"invalid_api_key"}}'
expected_canonical_error:
  canonical_code: "upstream_auth_failed"
  error_type: "authentication_error"
  retryable_pre_stream: false
  trigger_reauth: true
