case_id: "ollama_error_429"
description: "Verifies 429 overload throttling on Ollama queue."
capability: "error_normalization"
config:
  endpoint_base_url: "http://localhost:11434"
secret_slots: {}
normalized_input:
  model: "llama3.2"
  stream: false
  messages:
    - role: "user"
      content: "ping"
upstream_recorded_exchange:
  status: 429
  headers:
    content-type: "application/json"
    retry-after: "3"
  raw_body: '{"error":{"message":"Too many concurrent Ollama requests","code":"rate_limit_exceeded"}}'
expected_canonical_error:
  canonical_code: "upstream_rate_limited"
  error_type: "rate_limit_error"
  retryable_pre_stream: true
  trigger_reauth: false
