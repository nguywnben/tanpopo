case_id: "ollama_error_500"
description: "Verifies 500 local runner crash maps to retryable server_error."
capability: "error_normalization"
config:
  endpoint_base_url: "http://localhost:11434"
secret_slots: {}
normalized_input:
  model: "llama3.2"
  stream: false
  messages:
    - role: "user"
      content: "ping"
upstream_recorded_exchange:
  status: 500
  headers:
    content-type: "application/json"
  raw_body: '{"error":{"message":"model runner has unexpectedly stopped","code":"runner_error"}}'
expected_canonical_error:
  error_type: "server_error"
  retryable_pre_stream: true
  trigger_reauth: false
