case_id: "ollama_native_passthrough"
description: "Verifies /native/ollama/v1/chat/completions preserves Ollama options/keep_alive with zero auth injection in NONE mode."
capability: "native_passthrough"
config:
  endpoint_base_url: "http://localhost:11434"
  dialect: "openai_chat"
  upstream_path: "v1/chat/completions"
secret_slots: {}
normalized_input:
  model: "llama3.2"
  keep_alive: "10m"
  options:
    num_ctx: 8192
  messages:
    - role: "user"
      content: "Status"
upstream_recorded_exchange:
  status: 200
  headers:
    content-type: "application/json"
  raw_body: '{"id":"chatcmpl-ollama-nat","object":"chat.completion","model":"llama3.2","choices":[{"index":0,"message":{"role":"assistant","content":"local_ok"},"finish_reason":"stop"}],"usage":{"prompt_tokens":13,"completion_tokens":3}}'
expected_normalized_output:
  model: "llama3.2"
  content_contains: "local_ok"
  require_usage: true
  input_tokens: 13
  output_tokens: 3
