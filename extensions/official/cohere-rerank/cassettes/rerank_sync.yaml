case_id: "cohere_rerank_sync"
description: "Normalizes a Cohere v2 rerank response and exact billed search units."
capability: "rerank"
config:
  endpoint_base_url: "https://api.cohere.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "rerank-v3.5"
  query: "What is Tanpopo?"
  documents: ["A gateway", "A flower"]
upstream_recorded_exchange:
  status: 200
  headers:
    content-type: "application/json"
  expected_upstream_headers:
    Authorization: "Bearer __CANARY_SECRET__"
  raw_body: '{"id":"rr-1","model":"rerank-v3.5","results":[{"index":1,"relevance_score":0.94},{"index":0,"relevance_score":0.18}],"billed_units":{"search_units":2}}'
expected_normalized_output:
  model: "rerank-v3.5"
  rerank_results_count: 2
  rerank_first_index: 1
  rerank_search_units: 2
