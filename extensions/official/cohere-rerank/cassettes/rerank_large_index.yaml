case_id: "cohere_rerank_large_index"
description: "Preserves a higher original input index after ranking."
capability: "rerank"
config:
  endpoint_base_url: "https://api.cohere.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "rerank-v3.5"
  query: "rank last item"
  documents: ["a", "b", "c", "d", "e"]
upstream_recorded_exchange:
  status: 200
  headers:
    content-type: "application/json"
  expected_upstream_headers:
    Authorization: "Bearer __CANARY_SECRET__"
  raw_body: '{"id":"rr-8","model":"rerank-v3.5","results":[{"index":4,"relevance_score":0.99}],"billed_units":{"search_units":5}}'
expected_normalized_output:
  rerank_results_count: 1
  rerank_first_index: 4
  rerank_search_units: 5
