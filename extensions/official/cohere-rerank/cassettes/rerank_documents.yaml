case_id: "cohere_rerank_documents"
description: "Preserves provider-returned document metadata when requested."
capability: "rerank"
config:
  endpoint_base_url: "https://api.cohere.com"
secret_slots:
  api_key: "__CANARY_SECRET__"
normalized_input:
  model: "rerank-v3.5"
  query: "find the title"
  documents: ["title: alpha", "title: beta"]
  return_documents: true
upstream_recorded_exchange:
  status: 200
  headers:
    content-type: "application/json"
  expected_upstream_headers:
    Authorization: "Bearer __CANARY_SECRET__"
  raw_body: '{"id":"rr-3","results":[{"index":0,"relevance_score":0.77,"document":{"text":"title: alpha"}}],"billed_units":{"search_units":2}}'
expected_normalized_output:
  rerank_results_count: 1
  rerank_first_index: 0
  rerank_search_units: 2
